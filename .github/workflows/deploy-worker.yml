name: Deploy Cloudflare Worker

# Manual only. After merge, run this to publish nfl-missed-kick-scheduler
# and inject GITHUB_TOKEN so the Worker can repository_dispatch nfl-poll.
on:
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Require deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_GITHUB_PAT: ${{ secrets.WORKER_GITHUB_PAT }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. Create a Cloudflare API token with Workers Scripts Edit and Workers KV Storage Edit."
            missing=1
          fi
          if [ -z "$WORKER_GITHUB_PAT" ]; then
            echo "::error::Missing repository secret WORKER_GITHUB_PAT. This PAT is piped into the Worker secret GITHUB_TOKEN so the scheduler can repository_dispatch nfl-poll."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Check SLATE KV namespace id
        run: |
          if grep -q '00000000000000000000000000000000' wrangler.jsonc; then
            echo "::error::worker/wrangler.jsonc still has the placeholder SLATE KV id. Expected nfl-missed-kick-slate (dc5248300f0c41898bba2959b3d5c314)."
            exit 1
          fi

      - name: Install Worker dependencies
        run: npm ci

      - name: Resolve Cloudflare account ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Using CLOUDFLARE_ACCOUNT_ID from repository variable."
            echo "CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "CLOUDFLARE_ACCOUNT_ID is unset; discovering from CLOUDFLARE_API_TOKEN."
          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          def fail(message: str) -> None:
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)

          def pick_single_account(accounts, source: str) -> str:
              ids = [(a.get("name") or "?", a.get("id") or "") for a in accounts if a.get("id")]
              if not ids:
                  fail(f"{source} listed no Cloudflare accounts for this token.")
              if len(ids) > 1:
                  listing = ", ".join(f"{name} ({account_id})" for name, account_id in ids)
                  fail(
                      "Token can access multiple Cloudflare accounts "
                      f"({listing}). Set repository variable CLOUDFLARE_ACCOUNT_ID "
                      "to the account that owns nfl-missed-kick-scheduler."
                  )
              return ids[0][1]

          def accounts_from_whoami():
              try:
                  proc = subprocess.run(
                      ["npx", "wrangler", "whoami", "--json"],
                      check=False,
                      capture_output=True,
                      text=True,
                  )
              except OSError as exc:
                  print(f"wrangler whoami could not start: {exc}", file=sys.stderr)
                  return None
              raw = proc.stdout or ""
              start, end = raw.find("{"), raw.rfind("}")
              if start < 0 or end < 0:
                  print("wrangler whoami --json produced no JSON object.", file=sys.stderr)
                  if proc.stderr:
                      print(proc.stderr[-2000:], file=sys.stderr)
                  return None
              data = json.loads(raw[start : end + 1])
              return data.get("accounts") or []

          def accounts_from_api(token: str):
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4/accounts?per_page=50",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "nfl-missed-kick-bot-deploy",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.load(resp)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")[:400]
                  fail(
                      f"Cloudflare accounts API returned HTTP {exc.code}. "
                      f"Check CLOUDFLARE_API_TOKEN. {detail}"
                  )
              except urllib.error.URLError as exc:
                  fail(f"Cloudflare accounts API request failed: {exc.reason}")
              if not data.get("success"):
                  errs = data.get("errors") or []
                  msg = "; ".join(
                      e.get("message", str(e)) for e in errs
                  ) or "Cloudflare accounts API failed"
                  fail(f"{msg}. Check CLOUDFLARE_API_TOKEN.")
              return data.get("result") or []

          token = (os.environ.get("CLOUDFLARE_API_TOKEN") or "").strip()
          if not token:
              fail("Missing repository secret CLOUDFLARE_API_TOKEN.")

          accounts = accounts_from_whoami()
          source = "wrangler whoami"
          if not accounts:
              print("Falling back to Cloudflare accounts API.")
              accounts = accounts_from_api(token)
              source = "Cloudflare API"

          account_id = pick_single_account(accounts, source)
          print(f"Discovered Cloudflare account {account_id} via {source}.")
          github_env = os.environ.get("GITHUB_ENV")
          if not github_env:
              fail("GITHUB_ENV is not set.")
          with open(github_env, "a", encoding="utf-8") as fh:
              fh.write(f"CLOUDFLARE_ACCOUNT_ID={account_id}\n")
          PY

      - name: Deploy nfl-missed-kick-scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Set Worker secret GITHUB_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_GITHUB_PAT: ${{ secrets.WORKER_GITHUB_PAT }}
        run: |
          # Pipe the PAT; never echo the value. GitHub also masks secrets.* in logs.
          printf '%s' "$WORKER_GITHUB_PAT" | npx wrangler secret put GITHUB_TOKEN --name nfl-missed-kick-scheduler
