name: CI

# Tests only, and only on pull requests. This workflow does not tweet, does not
# dispatch the poll workflow, and does not read X or GitHub Action secrets.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage
      - name: Coverage summary
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; const s = JSON.parse(readFileSync('coverage/coverage-summary.json','utf8')).total; console.log('root statements %s%  branches %s%  functions %s%  lines %s%', s.statements.pct, s.branches.pct, s.functions.pct, s.lines.pct);"

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # wrangler 4 (worker package) requires Node >=22
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage
      - name: Coverage summary
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; const s = JSON.parse(readFileSync('coverage/coverage-summary.json','utf8')).total; console.log('worker statements %s%  branches %s%  functions %s%  lines %s%', s.statements.pct, s.branches.pct, s.functions.pct, s.lines.pct);"
      # Bundles the Worker without needing Cloudflare credentials.
      - run: npm run deploy:dry-run

  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Season miss-leaders unit tests
        run: python3 -m unittest discover -s board/tests -v
