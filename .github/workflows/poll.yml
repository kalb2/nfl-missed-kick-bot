name: Poll ESPN and tweet misses

# Primary wake source is GitHub Actions cron (no Cloudflare required).
# GitHub cron is UTC; 5 minutes is the practical minimum. Local notes
# below are America/Denver (MT).
#
# Dense poll Thursday–Monday UTC so TNF, Friday/Saturday slates
# (internationals, Christmas), Sunday, and MNF are covered without a
# Worker. Early Tuesday UTC keeps late MNF that is still Monday evening
# in America/Denver in window — same idea as worker/ `*/2 0-7 * * TUE`.
#
#   */5 * * * 4,5,6,0,1   # Thu–Mon all day UTC
#   */5 0-7 * * 2         # Tue 00:00–07:59 UTC (Mon ~5–6 PM through ~1 AM MT)
#
# repository_dispatch (nfl-poll) stays so a Cloudflare Worker can still
# wake this workflow later when it is deployed. workflow_dispatch is for
# emergency / demo runs.
on:
  schedule:
    - cron: "*/5 * * * 4,5,6,0,1"
    - cron: "*/5 0-7 * * 2"
  repository_dispatch:
    types: [nfl-poll]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log tweets instead of posting"
        type: boolean
        default: true
      seed:
        description: "Seed seen play IDs without tweeting"
        type: boolean
        default: false
      all_today:
        description: "Include all of today's finished games (useful for a dry-run demo)"
        type: boolean
        default: false

concurrency:
  group: missed-kick-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Restore seen-play cache
        uses: actions/cache@v4
        with:
          path: .state
          key: missed-kicks-${{ github.run_id }}
          restore-keys: |
            missed-kicks-

      - name: Resolve dry-run / seed flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "seed=${{ github.event.inputs.seed }}" >> "$GITHUB_OUTPUT"
            echo "all_today=${{ github.event.inputs.all_today }}" >> "$GITHUB_OUTPUT"
          else
            # schedule (primary) and repository_dispatch (optional Worker):
            # same live defaults as before the Worker-only change.
            echo "dry_run=${{ vars.DRY_RUN || 'true' }}" >> "$GITHUB_OUTPUT"
            echo "seed=${{ vars.SEED_SEEN || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "all_today=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Poll scoreboard and post new misses
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ steps.flags.outputs.dry_run }}
          SEED_SEEN: ${{ steps.flags.outputs.seed }}
          STATE_PATH: .state/seen.json
        run: |
          EXTRA=""
          if [ "${{ steps.flags.outputs.all_today }}" = "true" ]; then
            EXTRA="--all-today"
          fi
          npx tsx src/index.ts once $EXTRA
